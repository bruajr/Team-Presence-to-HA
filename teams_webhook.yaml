input_boolean:
  teams_on_call:
    name: Teams On Call
    icon: mdi:phone-in-talk

automation:
  - id: teams_webhook_on
    alias: "Teams Webhook -> On Call ON"
    mode: single
    trigger:
      - platform: webhook
        webhook_id: teams_on_call_on
        allowed_methods:
          - POST
          - GET
        # local_only: true   # leave commented for now (testing)
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.teams_on_call

  - id: teams_webhook_off
    alias: "Teams Webhook -> On Call OFF"
    mode: single
    trigger:
      - platform: webhook
        webhook_id: teams_on_call_off
        allowed_methods:
          - POST
          - GET
        # local_only: true   # leave commented for now (testing)
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.teams_on_call
